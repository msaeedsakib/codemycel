[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/msaeedsakib/codemycel"
publish = false

[workspace.dependencies]
codemycel-core = { path = "crates/codemycel-core" }
codemycel-parse = { path = "crates/codemycel-parse" }
codemycel-lsp = { path = "crates/codemycel-lsp" }
codemycel-scip = { path = "crates/codemycel-scip" }
codemycel-index = { path = "crates/codemycel-index" }
codemycel-mcp = { path = "crates/codemycel-mcp" }
codemycel-ui = { path = "crates/codemycel-ui" }

anyhow = "1.0.104"
blake3 = { version = "1.8.7", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
