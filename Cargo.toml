[workspace]
resolver = "3"
members = ["crates/*", "eval"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/msaeedsakib/codemycel"
publish = false

[workspace.dependencies]
codemycel-core = { path = "crates/codemycel-core" }
codemycel-parse = { path = "crates/codemycel-parse" }
codemycel-lsp = { path = "crates/codemycel-lsp" }
codemycel-scip = { path = "crates/codemycel-scip" }
codemycel-index = { path = "crates/codemycel-index" }
codemycel-mcp = { path = "crates/codemycel-mcp" }
codemycel-ui = { path = "crates/codemycel-ui" }

anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
blake3 = { version = "1.8.7", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
globset = "0.4.21"
ignore = "0.4.34"
include_dir = "0.7.4"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde_json"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde"] }
lsp-types = "0.97.0"
nix = { version = "0.31.3", features = ["signal"] }
notify = "8.2.1"
petgraph = { version = "0.8.3", default-features = false, features = ["std", "graphmap"] }
protobuf = "=3.7.2"
rayon = "1.12.0"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
schemars = "1.2.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
scip = "0.10.0"
serde_json = "1"
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }
tree-sitter = "0.27.1"
tree-sitter-javascript = "0.25.0"
tree-sitter-md = { version = "0.5.4", features = ["parser"] }
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

console_error_panic_hook = "0.1.7"
js-sys = "0.3.106"
leptos = { version = "0.8.22", features = ["csr"] }
leptos_router = "0.8.17"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = "0.3.106"

assert_cmd = "2.2.2"
predicates = "3.1.4"
similar = "3.2.1"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
