[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
packages = ["codemycel"]
installers = []
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-musl",
]
unix-archive = ".tar.gz"
windows-archive = ".zip"
checksum = "sha256"
features = ["ui-bundle"]
github-build-setup = "../build-setup.yml"
global-artifacts-jobs = ["./clean-machine"]
pr-run-mode = "upload"
