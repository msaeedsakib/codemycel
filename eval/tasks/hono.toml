# Tasks run against honojs/hono at the commit pinned in eval/README.md.
# `expected` describes a correct answer's shape so a reader can judge the logged answers.

[[task]]
id = "request-dispatch"
kind = "orientation"
prompt = """How does a request passed to `app.fetch` reach a route handler in this repository? \
Name the files and functions on the path, including where the router is chosen and where \
matching happens. Answer in at most 15 lines; do not modify any file."""
expected = """`fetch` in src/hono-base.ts calls the private `#dispatch`, which calls \
`this.router.match(method, path)` on the `Router` interface (src/router.ts). The default router \
is `SmartRouter` (src/router/smart-router/router.ts) over `RegExpRouter` and `TrieRouter`, \
chosen in src/hono.ts. The matched handlers run through `compose` (src/compose.ts), or directly \
when there is a single handler."""
items = [
    "`fetch` in src/hono-base.ts",
    "the private `#dispatch` in src/hono-base.ts, called by `fetch`",
    "`this.router.match(method, path)` called in `#dispatch`",
    "the `Router` interface in src/router.ts",
    "`SmartRouter` (src/router/smart-router/router.ts) as the default router",
    "`RegExpRouter` and `TrieRouter` as SmartRouter's candidate routers",
    "src/hono.ts as where the default router is chosen",
    "`compose` (src/compose.ts) running the matched handlers",
    "the single-handler path that skips `compose`",
]

[[task]]
id = "router-match-impact"
kind = "impact"
prompt = """Which classes implement the `Router` interface's `match` method in src/router.ts, who \
calls `match` outside the routers themselves, and what would break if its signature changed? \
Answer in at most 20 lines; do not modify any file."""
expected = """Implementations: RegExpRouter, PreparedRegExpRouter, TrieRouter, LinearRouter, \
PatternRouter, SmartRouter (which delegates to its candidate routers). RegExpRouter and \
PreparedRegExpRouter take `match` from the shared function in src/router/reg-exp-router/matcher.ts. \
Callers: `HonoBase#dispatch` in src/hono-base.ts, `getRouterName` in src/helper/dev/index.ts, the \
combine middleware's `except` and the method-not-allowed middleware (both on a `TrieRouter`), plus \
SmartRouter's own delegation. Every implementation and every caller would need to change; tests \
that call `match` directly are secondary."""
items = [
    "`RegExpRouter` implements `match`",
    "`PreparedRegExpRouter` implements `match`",
    "`TrieRouter` implements `match`",
    "`LinearRouter` implements `match`",
    "`PatternRouter` implements `match`",
    "`SmartRouter` implements `match`",
    "`HonoBase#dispatch` in src/hono-base.ts calls `match`",
    "SmartRouter's own delegation to its candidate routers calls `match`",
    "`getRouterName` in src/helper/dev/index.ts calls `match`",
    "the combine middleware's `except` and the method-not-allowed middleware call `match` on a `TrieRouter`",
    "RegExpRouter and PreparedRegExpRouter share the `match` function in src/router/reg-exp-router/matcher.ts",
    "every implementation and every caller would need to change",
]

